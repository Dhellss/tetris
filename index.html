<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0e0f15" />
<meta name="description" content="A modern Tetris with an animated guide to spins and wall kicks." />
<title>Tetris</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="stage">
    <aside id="hud">
      <div class="stat"><span class="label">SCORE</span><span id="stat-score" class="value">0</span></div>
      <div class="stat"><span class="label">LEVEL</span><span id="stat-level" class="value">1</span></div>
      <div class="stat"><span class="label">LINES</span><span id="stat-lines" class="value">0</span></div>
      <div class="stat"><span class="label">TIME</span><span id="stat-time" class="value">0:00.00</span></div>
      <div class="stat"><span class="label">PPS</span><span id="stat-pps" class="value">0.0</span></div>
    </aside>

    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="popups"></div>
    </div>

    <!-- Balances the HUD column so the well sits on the screen's centre
         line. The renderer measures #board-wrap, so that element has to
         keep a width of its own rather than shrink to the canvas. -->
    <div id="hud-balance" aria-hidden="true"></div>
  </main>

  <noscript>
    <p class="fallback">This game needs JavaScript enabled to run.</p>
  </noscript>

  <script src="engine/pieces.js"></script>
  <script src="engine/board.js"></script>
  <script src="engine/randomizer.js"></script>
  <script src="engine/srs.js"></script>
  <script src="engine/scoring.js"></script>
  <script src="engine/game.js"></script>
  <script src="ui/renderer.js"></script>
  <script src="ui/input.js"></script>
  <script src="ui/hud.js"></script>
  <!-- later tasks add screens.js and spin-guide.js here -->
  <script src="main.js"></script>
</body>
</html>
