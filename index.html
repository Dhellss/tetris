<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0e0f15" />
<meta name="description" content="A modern Tetris with an animated guide to spins and wall kicks." />
<title>Tetris</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="stage">
    <aside id="hud">
      <div class="stat"><span class="label">SCORE</span><span id="stat-score" class="value">0</span></div>
      <div class="stat"><span class="label">LEVEL</span><span id="stat-level" class="value">1</span></div>
      <div class="stat"><span class="label">LINES</span><span id="stat-lines" class="value">0</span></div>
      <div class="stat"><span class="label">TIME</span><span id="stat-time" class="value">0:00.00</span></div>
      <div class="stat"><span class="label">PPS</span><span id="stat-pps" class="value">0.0</span></div>
    </aside>

    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="popups"></div>
    </div>

    <!-- Balances the HUD column so the well sits on the screen's centre
         line. The renderer measures #board-wrap, so that element has to
         keep a width of its own rather than shrink to the canvas. -->
    <div id="hud-balance" aria-hidden="true"></div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <section id="screen-menu" class="panel" hidden>
      <h1>TETRIS</h1>
      <button type="button" data-action="marathon">Marathon</button>
      <button type="button" data-action="sprint">Sprint 40L</button>
      <button type="button" data-action="guide">Spin Guide</button>
      <button type="button" data-action="settings">Settings</button>
      <p class="bests">
        <span>Marathon best: <b id="best-marathon">—</b></span>
        <span>Sprint best: <b id="best-sprint">—</b></span>
      </p>
      <p class="hint">Arrows move · Z / X rotate · A flips · Space drops · C holds · Esc pauses</p>
    </section>

    <section id="screen-pause" class="panel" hidden>
      <h2>Paused</h2>
      <button type="button" data-action="resume">Resume</button>
      <button type="button" data-action="restart">Restart</button>
      <button type="button" data-action="menu">Main menu</button>
    </section>

    <section id="screen-over" class="panel" hidden>
      <h2 id="over-title">Game over</h2>
      <p id="over-detail"></p>
      <p id="over-best" class="best-note" hidden>New personal best</p>
      <button type="button" data-action="restart">Play again</button>
      <button type="button" data-action="menu">Main menu</button>
    </section>

    <section id="screen-settings" class="panel wide" hidden>
      <h2>Settings</h2>
      <div class="handling">
        <label>DAS <input id="set-das" type="range" min="0" max="300" step="5" /> <output id="out-das"></output></label>
        <label>ARR <input id="set-arr" type="range" min="0" max="100" step="1" /> <output id="out-arr"></output></label>
        <label>Soft drop <input id="set-sdf" type="range" min="1" max="60" step="1" /> <output id="out-sdf"></output></label>
      </div>
      <div id="binding-list" class="bindings"></div>
      <button type="button" data-action="reset-settings">Reset to defaults</button>
      <button type="button" data-action="menu">Back</button>
    </section>
  </div>

  <noscript>
    <p class="fallback">This game needs JavaScript enabled to run.</p>
  </noscript>

  <script src="engine/pieces.js"></script>
  <script src="engine/board.js"></script>
  <script src="engine/randomizer.js"></script>
  <script src="engine/srs.js"></script>
  <script src="engine/scoring.js"></script>
  <script src="engine/game.js"></script>
  <script src="ui/renderer.js"></script>
  <script src="ui/input.js"></script>
  <script src="ui/hud.js"></script>
  <script src="ui/bests.js"></script>
  <script src="ui/screens.js"></script>
  <!-- the spin guide arrives in the next task -->
  <script src="main.js"></script>
</body>
</html>
